name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JS runtime / compiler / tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @onestack/example-counter build
      - run: pnpm --filter @onestack/example-universal build
      - run: pnpm --filter @onestack/example-universal deploy:node
      - run: node scripts/smoke-universal.mjs

  fresh-windows-build:
    name: Fresh Windows workspace build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build from a clean checkout
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  desktop-native:
    name: Desktop host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check native host
        run: cargo check --manifest-path packages/desktop/native/Cargo.toml
      - name: Package counter and universal applications
        run: |
          pnpm --filter @onestack/example-counter exec onestack build --target desktop
          pnpm --filter @onestack/example-universal exec onestack build --target desktop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package-desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/*
          if-no-files-found: error

  service-contracts:
    name: PostgreSQL and S3 contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: onestack
          POSTGRES_USER: onestack
          POSTGRES_DB: onestack
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      s3:
        image: motoserver/moto:5.1.11
        ports: ['5000:5000']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://onestack:onestack@127.0.0.1:5432/onestack
          TEST_S3_ENDPOINT: http://127.0.0.1:5000

  android:
    name: Android native build and launch
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @onestack/example-universal build:android
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install examples/universal/.onestack/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n dev.onestack.universal/dev.onestack.runtime.MainActivity
            sleep 10
            python3 scripts/smoke-android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug
          path: examples/universal/.onestack/mobile/android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS native build and launch
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: brew install xcodegen
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @onestack/example-universal build:ios
      - name: Launch on simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for values in d["devices"].values() for x in values if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" examples/universal/.onestack/mobile/ios/build/Build/Products/Debug-iphonesimulator/OneStack.app
          xcrun simctl launch "$DEVICE" dev.onestack.universal
          sleep 10
          xcrun simctl io "$DEVICE" screenshot /tmp/onestack-ios.png
          xcodebuild -project examples/universal/.onestack/mobile/ios/OneStack.xcodeproj -scheme OneStack -destination "id=$DEVICE" -derivedDataPath examples/universal/.onestack/mobile/ios/build CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshot
          path: /tmp/onestack-ios.png
      - name: Archive iOS simulator application
        run: tar -czf /tmp/onestack-universal-ios-simulator.tar.gz -C examples/universal/.onestack/mobile/ios/build/Build/Products/Debug-iphonesimulator OneStack.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: /tmp/onestack-universal-ios-simulator.tar.gz
          if-no-files-found: error
