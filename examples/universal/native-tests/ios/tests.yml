  OneStackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OneStackUITests.swift
    dependencies:
      - target: OneStack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.onestack.uitests
        TEST_TARGET_NAME: OneStack
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  OneStack:
    build:
      targets:
        OneStack: all
    test:
      targets:
        - OneStackUITests
