[package]
name = "onestack-desktop-host"
version = "0.2.0"
edition = "2021"
description = "Native desktop host for the OneStack universal application framework"
license = "MIT"

[dependencies]
anyhow = "1"
arboard = "3.6.1"
dirs = "6.0.0"
notify-rust = "4.18.0"
open = "5.4.1"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tao = "0.36.0"
ureq = "3.4.0"
wry = "0.56.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
